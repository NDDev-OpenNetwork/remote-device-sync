schema_version: 1

repository:
  id: "repo_01M3295WYVXFN3V6H0WFYN0BC7"
  display_name: "remote-device-sync"
  roles: ["project", "module"]
  lifecycle: "active"

provider:
  type: "github"
  installation: "installation:github-opennetwork"
  repository_id: 1380014631
  owner: "NDDev-OpenNetwork"
  name: "remote-device-sync"

classification:
  portfolios: ["portfolio:opennetwork-projects"]
  visibility_contract: "public"
  data_classification: "public"

product:
  purpose: >-
    Remote device access for the GDS estate: SSH-based connectivity and remote
    desktop sessions between enrolled devices, brokered through the GDS server.
  capabilities:
    - "Rust workspace: native SSH, shared session manager and device selection"
    - "Signed discovery, scoped authorization, QUIC transports and owned relay"
    - "Content-addressed single-file sync and bounded observability"
    - "Experimental desktop protocol/backends; interactive renderer and native qualification pending"
  entrypoints:
    - change: "Wire protocol and authorization types"
      path: "crates/rds-core/src/lib.rs"
    - change: "rds operator CLI"
      path: "crates/rds-cli/src/main.rs"
    - change: "Device agent and shared session manager"
      path: "crates/rds-agent/src/main.rs"
    - change: "Directory and relay server"
      path: "crates/rds-server/src/main.rs"
    - change: "Package manifest"
      path: "Cargo.toml"

policy:
  profiles: ["repository-default", "public-module", "continuous-development"]
  rollout_ring: "standard"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

verification:
  commands:
    lint: ["cargo fmt --check", "cargo clippy --locked --workspace --all-targets -- -D warnings"]
    test: ["cargo test --locked --workspace"]
  required: ["lint", "test"]
  required_contexts: []

agent:
  context_profile: "project-default"
  generated_agents: false
  serena: {enabled: false, provenance_required: false}

module:
  contract: "public"
  consumption: ["git-submodule"]
  compatibility: "commit-contract"
  pin_policy: "default-branch-commit"
  publication: {registry: "none", github_release: "optional"}

release:
  mode: "github-release"
  tag_style: "semver"
  required_checks:
    - "rust / clippy"
    - "rust / test (ubuntu-latest)"
    - "rust / test (macos-latest)"
    - "rust supply chain / cargo-deny"
    - "rust supply chain / cargo-audit"
    - "codeql / CodeQL (rust)"
    - "codeql / CodeQL (actions)"
