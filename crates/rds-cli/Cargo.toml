[package]
name = "rds-cli"
description = "Operator CLI for remote device access over the rds transport"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
desktop = ["dep:rds-desktop", "rds-desktop/x11"]
## Owned transport backend for `--backend noq` selection (WS1).
transport-noq = ["rds-net/transport-noq"]

[dependencies]
rds-client.workspace = true
rds-observe.workspace = true
anyhow.workspace = true
clap.workspace = true
rds-core.workspace = true
rds-desktop = { workspace = true, optional = true }
rds-net.workspace = true
rds-discovery.workspace = true
rds-sync.workspace = true
rds-ssh.workspace = true
rustix = { workspace = true, features = ["termios", "event"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize = "1"

[dev-dependencies]
iroh.workspace = true
russh.workspace = true
rds-agent.workspace = true
rustix = { workspace = true, features = ["pty"] }

[[bin]]
name = "rds"
path = "src/main.rs"

[lints]
workspace = true
