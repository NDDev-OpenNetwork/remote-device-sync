[package]
name = "rds-desktop"
description = "Desktop session pipeline for rds: capture, encode, input, decode"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
x11 = ["dep:x11rb", "dep:openh264", "dep:openh264-sys2", "dep:memmap2", "dep:rustix"]
viewer = ["dep:wgpu", "dep:winit", "dep:pollster", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
blake3.workspace = true
bytes.workspace = true
rand.workspace = true
memmap2 = { version = "0.9", optional = true }
openh264 = { version = "0.9", optional = true }
# Already supplied by openh264; its typed native options expose live rate
# updates without restarting the encoder and breaking its reference chain.
openh264-sys2 = { version = "0.9", default-features = false, optional = true }
rds-core.workspace = true
rds-net.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
x11rb = { version = "0.14", features = ["shm", "xtest", "xfixes", "damage", "xkb"], optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "gles", "wgsl"], optional = true }
# Native window/input only; client-side Adwaita decorations unnecessarily pull
# font parsers into the desktop client. Use the window system's decorations.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }
pollster = { version = "1.0", optional = true }
serde.workspace = true
rustix = { workspace = true, features = ["event", "time"], optional = true }

# The same thin AppKit bindings already used by winit, for a Dock icon when
# launched directly from the CLI as well as from a packaged application.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSAlert", "NSButton", "NSPasteboard", "NSView", "NSWindow"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSObject", "NSProcessInfo"], optional = true }

[dev-dependencies]
noq.workspace = true
rds-bench = { workspace = true, features = ["transport-noq"] }
rds-sync.workspace = true

[lints]
workspace = true
