[package]
name = "rds-desktop"
description = "Desktop session pipeline for rds: capture, encode, input, decode"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
x11 = ["dep:x11rb", "dep:openh264", "dep:memmap2", "dep:rustix"]
viewer = ["dep:wgpu", "dep:winit", "dep:pollster"]

[dependencies]
bytes.workspace = true
rand.workspace = true
memmap2 = { version = "0.9", optional = true }
openh264 = { version = "0.9", optional = true }
rds-core.workspace = true
rds-net.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
x11rb = { version = "0.14", features = ["shm", "xtest", "xfixes", "damage"], optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "gles", "wgsl"], optional = true }
winit = { version = "0.30.13", optional = true }
pollster = { version = "0.4", optional = true }
serde.workspace = true
rustix = { workspace = true, features = ["event"], optional = true }

[dev-dependencies]
noq.workspace = true
rds-bench = { workspace = true, features = ["transport-noq"] }
rds-sync.workspace = true

[lints]
workspace = true
