[package]
name = "rds-net"
description = "Network layer for rds: endpoint lifecycle, identity, tickets, transport backends"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
blake3 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
data-encoding.workspace = true
ed25519-dalek = { workspace = true, optional = true, features = ["pkcs8"] }
iroh.workspace = true
noq = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
postcard = { workspace = true, features = ["alloc"] }
rds-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[features]
default = []
## Owned transport backend on noq (WS1). Off by default until C1 parity.
transport-noq = [
    "dep:noq",
    "dep:blake3",
    "dep:bytes",
    "dep:ed25519-dalek",
    "dep:rand",
]

[lints]
workspace = true
