[package]
name = "rds-relay"
description = "RDS relay server: packet forwarding for endpoints behind hard NAT"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
iroh.workspace = true
iroh-relay = { workspace = true, features = ["server"] }
postcard = { workspace = true, features = ["alloc", "use-std"] }
rds-core.workspace = true
rds-net = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
## Owned relay server on rds-net's noq backend (WS2).
owned-relay = ["dep:rds-net", "rds-net/transport-noq"]

[lints]
workspace = true
